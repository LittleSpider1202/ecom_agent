server {
    listen 8080;
    server_name 192.168.3.100;

    client_max_body_size 50m;
    server_tokens off;

    access_log /var/log/nginx/ecom-agent.access.log;
    error_log  /var/log/nginx/ecom-agent.error.log;

    # 前端静态文件
    root /opt/ecom_agent/frontend/dist;
    index index.html;

    # SPA history 模式 - 所有路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # WebSocket 反向代理（必须在 /api/ 之前匹配）
    location /api/ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
