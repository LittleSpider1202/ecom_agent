# 流程定义 - 采集达人作品
id: collect-works
name: 采集达人作品
version: 5
description: 采集指定达人的作品列表，写入 NocoDB 数据表

trigger:
  type: manual

# ============ 参数定义（用户表单输入）============
parameters:
  - key: platform
    type: string
    label: 平台
    input: select
    options: [抖音]
    default: 抖音
    required: true
    row: 1
    span: 4

  - key: douyinId
    type: string
    label: 抖音号
    required: true
    row: 1
    span: 8

  - key: fields
    type: array
    label: 采集字段
    input: checkbox
    options:
      - 视频链接
      - 发布时间
      - 封面标题
      - 点赞数
      - 收藏数
      - 转发数
      - 评论数
      - 视频封面图
    default:
      - 视频链接
      - 发布时间
      - 封面标题
      - 点赞数
      - 收藏数
      - 转发数
      - 评论数
    required: true

  - key: dataSourceId
    type: number
    label: 数据源
    input: datasource
    required: true
    row: 2
    span: 8

  - key: writeMode
    type: string
    label: 写入方式
    input: select
    options: [新建, 追加]
    default: 新建
    required: true
    row: 2
    span: 4

  - key: tableName
    type: string
    label: 表名
    input: select
    options: [达人名称, 达人名称_日期]
    default: 达人名称
    required: true
    row: 3
    span: 6
    showWhen:
      writeMode: 新建

  - key: tableId
    type: string
    label: 表 ID
    placeholder: NocoDB 表 ID（如 m_xxx）
    required: true
    row: 3
    span: 6
    showWhen:
      writeMode: 追加

# ============ 节点定义 ============
# 单节点 RPA 调用：影刀采集数据 + 写入 NocoDB
# 后端 RPA 执行器自动将 dataSourceId 解析为 dataSource 连接配置
nodes:
  - id: fetch_and_write
    name: 采集并写入
    category: execute
    type: rpa
    config:
      script: 采集作品-抖音
    inputs:
      platform: "{{ platform }}"
      douyinId: "{{ douyinId }}"
      fields: "{{ fields }}"
      dataSourceId: "{{ dataSourceId }}"
      writeMode: "{{ writeMode }}"
      tableName: "{{ tableName }}"
      tableId: "{{ tableId }}"
    outputs: []

# ============ 连接定义 ============
connections:
  start: fetch_and_write
  fetch_and_write:
    success: null
    error: null
